site_name: cosmobench
site_description: "Benchmark harness measuring whether agent skills (cosmoskill, thcosmoskill) improve LLM answers in cosmology"
site_url: https://corentinravoux.github.io/cosmobench/
repo_url: https://github.com/corentinravoux/cosmobench
repo_name: corentinravoux/cosmobench
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - tables

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            members_order: source
            group_by_category: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API reference:
      - Overview: api/index.md
      - "cosmobench": api/cosmobench.md
